name: Android CI

# Fail-fast pipeline: cheap checks first, APK build last.
# NOTE: Gradle is provided by gradle/actions/setup-gradle (pinned below); the committed wrapper pins the same version for local use.
# NOTE: action refs use major-version tags for now; pin to commit SHAs before any release (see BUILD_AND_CI.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.9" # must match AGP 8.7.x requirement (see gradle/libs.versions.toml)

jobs:
  preflight:
    name: Preflight (repo + spec checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run preflight
        run: python3 tools/preflight.py

  core-tests:
    name: Core unit tests (JVM)
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Test :core
        run: gradle :core:test --no-daemon --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: core/build/reports/tests/test
          if-no-files-found: warn

  lint:
    name: Android lint (non-blocking until first green run)
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install SDK packages
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;34.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Lint
        run: gradle :app:lintDebug --no-daemon --stacktrace
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn

  build-apk:
    name: Build debug APK
    needs: core-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install SDK packages
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;34.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Assemble debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Validate APK and write build info
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          test -s "$APK"
          unzip -tq "$APK"
          unzip -l "$APK" | grep -q "AndroidManifest.xml"
          unzip -l "$APK" | grep -q "classes.dex"
          mkdir -p dist
          cp "$APK" dist/Console2Android-debug.apk
          {
            echo "commit: ${GITHUB_SHA}"
            echo "run: ${GITHUB_RUN_ID}"
            echo "gradle: ${GRADLE_VERSION}"
            echo "apk_sha256: $(sha256sum dist/Console2Android-debug.apk | cut -d' ' -f1)"
            echo "apk_bytes: $(stat -c %s dist/Console2Android-debug.apk)"
            echo "native_libs: $(unzip -l "$APK" | grep -c '\.so$' || true)"
          } | tee dist/BUILD_INFO.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Console2Android-debug-apk
          path: dist/
          if-no-files-found: error
