name: Build Cemu Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Release = veloce, asserzioni spente (consigliato). Debug = nativo non ottimizzato con asserzioni attive (si chiude su ogni 'unimplemented')"
        type: choice
        options:
          - Release
          - Debug
        default: Release
      neural:
        description: "Sistema a pesi neurali (ordine di compilazione JIT). Togli la spunta per confrontare con la versione senza"
        type: boolean
        default: true
      diagnostics:
        description: "Build con profiling/watchdog attivi (più lento, solo per debug)"
        type: boolean
        default: false
      jit_trace:
        description: "Build con log JIT dettagliati (molto verboso)"
        type: boolean
        default: false

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch vcpkg (needs the full git history; every other dependency must already be inside the repository)
        run: |
          set -e
          if [ -z "$(ls -A dependencies/vcpkg 2>/dev/null)" ]; then
            echo "::warning::dependencies/vcpkg is empty, cloning it"
            rm -rf dependencies/vcpkg
            git clone https://github.com/microsoft/vcpkg dependencies/vcpkg
          fi

      - name: Fetch liblinkernsbypass if it is not in the repository (nested submodule of libadrenotools; GitHub zips do not contain it)
        run: |
          set -e
          D=dependencies/libadrenotools/lib/linkernsbypass
          if ! grep -qs linkernsbypass "$D/CMakeLists.txt"; then
            echo "::warning::$D is missing: cloning https://github.com/bylaws/liblinkernsbypass (latest). Add its zip to the repository to make it self-contained."
            rm -rf "$D"
            git clone --depth 1 https://github.com/bylaws/liblinkernsbypass "$D"
          fi

      - name: Verify dependencies (stops in seconds, with the exact download links, instead of failing after an hour)
        run: |
          python3 tools/deps/check_dependencies.py --ci
          python3 tools/deps/check_imgui_symbols.py
          python3 tools/deps/check_cmake_paths.py

      - name: Preflight (static checks of files, includes, NDK/ABI/JDK, vcpkg; a few seconds)
        run: python3 tools/preflight/preflight.py --ci

      - name: Cache vcpkg binaries and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: cemu-android-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'dependencies/vcpkg_overlay_ports/**', 'src/android/**/*.gradle.kts', 'src/android/gradle/**') }}
          restore-keys: |
            cemu-android-${{ runner.os }}-

      - name: Keep the signing key between builds (so new APKs update the old one without uninstalling)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cemu-android-debug-keystore-v1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: latest

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd src/android
          chmod +x gradlew
          ./gradlew :app:assemble${{ inputs.build_type || 'Release' }} --no-daemon -Dorg.gradle.jvmargs="-Xmx4g" -Dorg.gradle.workers.max=2 \
            -PcemuDiagnostics=${{ inputs.diagnostics }} -PcemuJitTrace=${{ inputs.jit_trace }} -PcemuNeural=${{ inputs.neural }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cemu-Android-APK-${{ inputs.build_type || 'Release' }}
          path: src/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
