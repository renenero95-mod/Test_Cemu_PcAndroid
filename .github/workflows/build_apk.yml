name: Build Cemu Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Release = veloce, asserzioni spente (consigliato). Debug = nativo non ottimizzato con asserzioni attive (si chiude su ogni 'unimplemented')"
        type: choice
        options:
          - Release
          - Debug
        default: Release
      neural:
        description: "Sistema a pesi neurali (ordine di compilazione JIT). Togli la spunta per confrontare con la versione senza"
        type: boolean
        default: true
      diagnostics:
        description: "Build con profiling/watchdog attivi (più lento, solo per debug)"
        type: boolean
        default: false
      jit_trace:
        description: "Build con log JIT dettagliati (molto verboso)"
        type: boolean
        default: false

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch missing dependencies (fallback if submodules were not checked out)
        run: |
          set -e
          fetch() { # path url
            if [ -z "$(ls -A "$1" 2>/dev/null)" ]; then
              echo "::warning::$1 is empty, cloning $2"
              rm -rf "$1"; git clone --depth 1 "$2" "$1"
            fi
          }
          fetch dependencies/ZArchive      https://github.com/Exzap/ZArchive
          fetch dependencies/cubeb         https://github.com/mozilla/cubeb
          # Initialize cubeb nested dependencies (including sanitizers-cmake)
          git -C dependencies/cubeb submodule update --init --recursive
          fetch dependencies/Vulkan-Headers https://github.com/KhronosGroup/Vulkan-Headers
          fetch dependencies/imgui         https://github.com/ocornut/imgui
          fetch dependencies/libadrenotools https://github.com/bylaws/libadrenotools
          fetch dependencies/xbyak_aarch64 https://github.com/fujitsu/xbyak_aarch64
          # vcpkg needs full git history for the baseline in vcpkg.json (CMake unshallows it, but it must be a git repo)
          if [ -z "$(ls -A dependencies/vcpkg 2>/dev/null)" ]; then
            echo "::warning::dependencies/vcpkg is empty, cloning"
            rm -rf dependencies/vcpkg; git clone https://github.com/microsoft/vcpkg dependencies/vcpkg
          fi
          # libadrenotools has its own submodules (linkernsbypass)
          if [ -d dependencies/libadrenotools ]; then git -C dependencies/libadrenotools submodule update --init --recursive || true; fi

      - name: Cache vcpkg binaries and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: cemu-android-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'dependencies/vcpkg_overlay_ports/**', 'src/android/**/*.gradle.kts', 'src/android/gradle/**') }}
          restore-keys: |
            cemu-android-${{ runner.os }}-

      - name: Keep the signing key between builds (so new APKs update the old one without uninstalling)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cemu-android-debug-keystore-v1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: latest

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd src/android
          chmod +x gradlew
          ./gradlew :app:assemble${{ inputs.build_type || 'Release' }} --no-daemon -Dorg.gradle.jvmargs="-Xmx4g" -Dorg.gradle.workers.max=2 \
            -PcemuDiagnostics=${{ inputs.diagnostics }} -PcemuJitTrace=${{ inputs.jit_trace }} -PcemuNeural=${{ inputs.neural }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cemu-Android-APK-${{ inputs.build_type || 'Release' }}
          path: src/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
